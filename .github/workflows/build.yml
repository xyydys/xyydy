name: Build AwemeLiquidBar 3.11.53

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Xcode and iPhoneOS SDK
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iPhoneOS SDK: $SDK_VERSION"
          [[ "${SDK_VERSION%%.*}" -ge 26 ]]

      - name: Static preflight
        shell: bash
        run: python3 scripts/preflight.py

      - name: Typecheck Swift against the iPhoneOS SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos swiftc -typecheck -swift-version 5 -parse-as-library \
            -target arm64-apple-ios15.0 -sdk "$SDK_PATH" -I . \
            -import-objc-header AwemeLiquidBar-Bridging-Header.h \
            ALB3Chrome.swift AwemeAlbumMorphBar.swift ALBBottomSupport.swift

      - name: Syntax-check Objective-C sources (iOS 15 deployment target)
        shell: bash
        run: |
          set -euo pipefail
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          for SOURCE in ALBUnifiedMaterial.m ALB5BottomGeometry.m ALBNativeCarrierState.m \
                        WCLGEdgeEffect.m WCLGBackdropLayer.m WCLGEdgeGradientTables.m \
                        ALBDock.m ALBDockBridge.m ALBDockMaterial.m ALBDockAvatar.m; do
            xcrun --sdk iphoneos clang -target arm64-apple-ios15.0 \
              -isysroot "$SDK_PATH" -fobjc-arc -fblocks -fsyntax-only \
              -Werror=objc-missing-super-calls \
              -Wno-deprecated-declarations -Wno-unused-function -Wno-unused-variable \
              -Wno-nullability-completeness -I. "$SOURCE"
          done

      - name: Install packaging dependencies
        shell: bash
        run: brew install ldid dpkg

      - name: Install Theos
        shell: bash
        run: git clone --depth 1 --recursive https://github.com/theos/theos.git "$GITHUB_WORKSPACE/.theos"

      - name: Build rootless package
        shell: bash
        env:
          THEOS: ${{ github.workspace }}/.theos
        run: |
          set -euo pipefail
          make clean
          make package -j1
          mkdir -p out
          find packages -maxdepth 1 -type f -name '*.deb' -exec cp {} out/ \;
          find .theos/obj -name 'AwemeLiquidBar*.linkmap' -exec cp {} out/ \; || true
          find .theos/_ -name 'AwemeLiquidBar.dylib' -exec cp {} out/ \; || true
          ls -l out
          test -n "$(find out -maxdepth 1 -type f -name '*.deb' -print -quit)"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: AwemeLiquidBar-3.11.53-rootless
          path: out/*
          if-no-files-found: error
          retention-days: 14
